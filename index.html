<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>Joddy VIP Dresses</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f6f3f7;--card:#fff;--text:#201a24;--muted:#766b78;--line:#e6dfe8;--brand:#6d2f72;--brand2:#8e4b94;--danger:#b42318;--ok:#18734a}
    *{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}.centered{min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #0000000b}
    .login-card{width:min(430px,100%);padding:26px}.login-card h1{margin:0 0 6px}.login-card p{color:var(--muted)}
    input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d8cedb;border-radius:10px;background:#fff}
    textarea{min-height:85px;resize:vertical}.login-card input{margin:7px 0}
    .btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font-weight:700}.btn:hover{background:var(--brand2)}
    .btn.secondary{background:#746b76}.btn.light{background:#eee8ef;color:#3a303d}.btn.danger{background:var(--danger)}
    .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#2f2132;color:white;padding:20px 14px;display:flex;flex-direction:column;gap:12px}
    .brand{font-size:26px;font-weight:800;letter-spacing:2px;padding:8px 10px}.sidebar nav{display:grid;gap:7px}
    .sidebar nav button{border:0;text-align:right;padding:11px 12px;border-radius:10px;background:transparent;color:white}.sidebar nav button.active,.sidebar nav button:hover{background:#ffffff1a}
    .sidebar .logout{margin-top:auto}.content{padding:22px;min-width:0}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}header h2{margin:0}small{color:var(--muted)}
    .section{display:none}.active-section{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .stat{padding:18px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:27px;margin-top:6px;display:block}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px}
    .toolbar .left,.toolbar .right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{width:auto;min-width:170px}
    .panel{padding:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:13px;vertical-align:middle}
    th{background:#faf8fb;position:sticky;top:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee8ef;font-size:12px}
    .pill.available{background:#e8f6ef;color:#18734a}.pill.booked,.pill.rented{background:#fff3df;color:#9a5b00}.pill.sold{background:#ececec;color:#555}
    .row-actions{display:flex;gap:6px}.row-actions button{padding:6px 9px;border-radius:8px;border:0}
    .msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f2eef4}.msg.error{background:#fdecec;color:#8f1d18}.msg.ok{background:#eaf7f0;color:#17633f}
    .modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}
    .modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    .modal-head h3{margin:0}.close{border:0;background:#eee8ef;width:38px;height:38px;border-radius:10px;font-size:20px}
    .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form-grid .full{grid-column:1/-1}.form-grid label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
    .form-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:14px}
    .empty{padding:25px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:20;display:block}.brand{display:inline-block}.sidebar nav{display:flex;overflow:auto}.sidebar nav button{white-space:nowrap}.sidebar .logout{float:left}.content{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.toolbar input,.toolbar select{width:100%;min-width:0}.toolbar .left,.toolbar .right{width:100%}}
  </style>
</head>
<body>
  <div id="loginView" class="centered">
    <div class="card login-card">
      <h1>Joddy VIP Dresses</h1>
      <p>نظام إدارة الفساتين والإيجارات والفروع والمالية</p>
      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button id="loginBtn" class="btn" style="width:100%;margin-top:8px">دخول</button>
      <div id="loginMsg" class="msg hidden"></div>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand">JODDY</div>
      <nav>
        <button data-section="dashboard" class="active">لوحة التحكم</button>
        <button data-section="dresses">الفساتين</button>
        <button data-section="bookings">الإيجارات</button>
        <button data-section="customers">العملاء</button>
        <button data-section="branches">الفروع</button>
        <button data-section="preparation">التنظيف والتجهيز</button>
        <button data-section="finance">المالية</button>
      </nav>
      <button id="logoutBtn" class="btn danger logout">تسجيل الخروج</button>
    </aside>

    <main class="content">
      <header>
        <div><h2 id="pageTitle">لوحة التحكم</h2><small id="userLabel"></small></div>
        <button id="refreshBtn" class="btn light">تحديث</button>
      </header>

      <section id="dashboard" class="section active-section">
        <div class="stats">
          <div class="card stat"><span>الفساتين</span><strong id="dressCount">—</strong></div>
          <div class="card stat"><span>الإيجارات</span><strong id="bookingCount">—</strong></div>
          <div class="card stat"><span>العملاء</span><strong id="customerCount">—</strong></div>
          <div class="card stat"><span>الفروع</span><strong id="branchCount">—</strong></div>
        </div>
      </section>

      <section id="dresses" class="section">
        <div class="toolbar">
          <div class="right">
            <button id="addDressBtn" class="btn">+ إضافة فستان</button>
            <input id="dressSearch" placeholder="بحث بالكود / الاسم / اللون">
            <select id="dressStatusFilter">
              <option value="">كل الحالات</option>
              <option value="available">متاح</option><option value="booked">محجوز</option><option value="rented">مؤجر</option>
              <option value="preparation">تجهيز</option><option value="sold">مباع</option><option value="maintenance">صيانة</option><option value="inactive">غير نشط</option>
            </select>
          </div>
          <div class="left"><small id="dressResultCount"></small></div>
        </div>
        <div class="card panel">
          <div id="dressesMsg" class="msg hidden"></div>
          <div class="table-wrap"><div id="dressesTable"></div></div>
        </div>
      </section>

      <section id="bookings" class="section"><div class="card panel"><h3>الإيجارات</h3><div class="msg">سيتم تنفيذ شاشة الحجز الكاملة في الخطوة التالية.</div></div></section>
      <section id="customers" class="section"><div class="card panel"><h3>العملاء</h3><div id="customersTable"></div></div></section>
      <section id="branches" class="section"><div class="card panel"><h3>الفروع</h3><div id="branchesTable"></div></div></section>
      <section id="preparation" class="section"><div class="card panel"><h3>التنظيف والتجهيز</h3><div id="prepTable"></div></div></section>
      <section id="finance" class="section"><div class="card panel"><h3>المالية</h3><div class="msg">سيتم تنفيذ شاشة المالية الكاملة بعد شاشة الحجز.</div><div id="paymentsTable"></div></div></section>
    </main>
  </div>

  <div id="dressModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head"><h3 id="dressModalTitle">إضافة فستان</h3><button id="closeDressModal" class="close">×</button></div>
      <form id="dressForm">
        <input type="hidden" id="dressId">
        <div class="form-grid">
          <div><label>كود الفستان *</label><input id="dressCode" required></div>
          <div><label>اسم / وصف الفستان</label><input id="dressName"></div>
          <div><label>التصنيف</label><select id="dressCategory"></select></div>
          <div><label>الفرع الحالي *</label><select id="dressBranch" required></select></div>
          <div><label>المقاس</label><input id="dressSize"></div>
          <div><label>اللون</label><input id="dressColor"></div>
          <div><label>سعر الشراء</label><input id="purchasePrice" type="number" min="0" step="0.01" value="0"></div>
          <div><label>تاريخ الشراء</label><input id="purchaseDate" type="date"></div>
          <div><label>المورد</label><input id="supplier"></div>
          <div><label>سعر الإيجار الافتراضي</label><input id="rentalPrice" type="number" min="0" step="0.01" value="0"></div>
          <div><label>مبلغ التأمين الافتراضي</label><input id="deposit" type="number" min="0" step="0.01" value="0"></div>
          <div><label>سعر البيع</label><input id="salePrice" type="number" min="0" step="0.01"></div>
          <div><label>الحالة</label>
            <select id="dressStatus">
              <option value="available">متاح</option><option value="booked">محجوز</option><option value="rented">مؤجر</option>
              <option value="preparation">تجهيز</option><option value="sold">مباع</option><option value="maintenance">صيانة</option><option value="inactive">غير نشط</option>
            </select>
          </div>
          <div class="full"><label>رابط صورة الفستان</label><input id="photoUrl" type="url" placeholder="https://..."></div>
          <div class="full"><label>ملاحظات</label><textarea id="dressNotes"></textarea></div>
        </div>
        <div id="dressFormMsg" class="msg hidden"></div>
        <div class="form-actions">
          <button type="submit" class="btn">حفظ</button>
          <button type="button" id="cancelDressBtn" class="btn secondary">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

<script>
const SUPABASE_URL='https://qzgtjuxiqmixjriiczxm.supabase.co';
const SUPABASE_KEY='sb_publishable_Q_HEnAkqk9jrMOjcF2krtA_KhTEZJaA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null, branches=[], categories=[], dresses=[];
const $=id=>document.getElementById(id);
const statusAr={available:'متاح',booked:'محجوز',rented:'مؤجر',preparation:'تجهيز',sold:'مباع',maintenance:'صيانة',inactive:'غير نشط'};
const money=v=>Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:0,maximumFractionDigits:2});
function showMsg(el,text,type=''){el.textContent=text;el.className='msg '+type;el.classList.remove('hidden')}
function hideMsg(el){el.classList.add('hidden')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user; await enterApp();}
}
async function enterApp(){
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('userLabel').textContent=currentUser?.email||'';
  await Promise.all([loadLookups(),loadDashboard()]);
}
$('loginBtn').onclick=async()=>{
  hideMsg($('loginMsg'));
  const email=$('email').value.trim(),password=$('password').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)return showMsg($('loginMsg'),error.message,'error');
  currentUser=data.user; await enterApp();
};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('refreshBtn').onclick=async()=>{await loadLookups();await loadDashboard();if($('dresses').classList.contains('active-section'))await loadDresses()};

document.querySelectorAll('nav button').forEach(btn=>btn.onclick=async()=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active-section'));
  const id=btn.dataset.section;$(id).classList.add('active-section');$('pageTitle').textContent=btn.textContent;
  if(id==='dresses')await loadDresses();
  if(id==='customers')await loadSimple('customers','customersTable','full_name,mobile,national_id,address');
  if(id==='branches')await loadSimple('branches','branchesTable','name,active');
  if(id==='preparation')await loadSimple('preparation_tasks','prepTable','stage_name,status,responsible_name,started_at,completed_at');
  if(id==='finance')await loadSimple('payments','paymentsTable','amount,payment_type,payment_method,paid_at,notes');
});

async function loadLookups(){
  const [b,c]=await Promise.all([
    sb.from('branches').select('id,name,active').eq('active',true).order('name'),
    sb.from('categories').select('id,name,parent_id,active').eq('active',true).order('sort_order').order('name')
  ]);
  if(!b.error)branches=b.data||[]; if(!c.error)categories=c.data||[];
  $('dressBranch').innerHTML='<option value="">اختر الفرع</option>'+branches.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('dressCategory').innerHTML='<option value="">بدون تصنيف</option>'+categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
}
async function countTable(t,id){
  const {count,error}=await sb.from(t).select('*',{count:'exact',head:true});
  $(id).textContent=error?'—':(count??0);
}
async function loadDashboard(){
  await Promise.all([countTable('dresses','dressCount'),countTable('bookings','bookingCount'),countTable('customers','customerCount'),countTable('branches','branchCount')]);
}
async function loadSimple(table,target,cols){
  const {data,error}=await sb.from(table).select(cols).limit(100);
  if(error){$(target).innerHTML=`<div class="msg error">${esc(error.message)}</div>`;return}
  if(!data?.length){$(target).innerHTML='<div class="empty">لا توجد بيانات</div>';return}
  const keys=Object.keys(data[0]);
  $(target).innerHTML=`<div class="table-wrap"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

async function loadDresses(){
  hideMsg($('dressesMsg'));
  const {data,error}=await sb.from('dresses')
    .select('id,dress_code,name,category_id,current_branch_id,size,color,purchase_price,purchase_date,supplier,default_rental_price,sale_price,default_deposit,status,photo_url,notes,created_at,updated_at')
    .order('created_at',{ascending:false});
  if(error){showMsg($('dressesMsg'),'تعذر تحميل الفساتين: '+error.message,'error');return}
  dresses=data||[]; renderDresses();
}
function renderDresses(){
  const q=$('dressSearch').value.trim().toLowerCase(),status=$('dressStatusFilter').value;
  const rows=dresses.filter(d=>{
    const txt=[d.dress_code,d.name,d.color,d.size,d.supplier].join(' ').toLowerCase();
    return (!q||txt.includes(q)) && (!status||d.status===status);
  });
  $('dressResultCount').textContent=`${rows.length} فستان`;
  if(!rows.length){$('dressesTable').innerHTML='<div class="empty">لا توجد فساتين مطابقة</div>';return}
  $('dressesTable').innerHTML=`<table><thead><tr>
    <th>الكود</th><th>الاسم</th><th>الفرع</th><th>المقاس</th><th>اللون</th><th>الإيجار</th><th>التأمين</th><th>الحالة</th><th>إجراء</th>
  </tr></thead><tbody>${rows.map(d=>{
    const br=branches.find(x=>String(x.id)===String(d.current_branch_id));
    return `<tr>
      <td><b>${esc(d.dress_code)}</b></td><td>${esc(d.name||'')}</td><td>${esc(br?.name||'')}</td><td>${esc(d.size||'')}</td><td>${esc(d.color||'')}</td>
      <td>${money(d.default_rental_price)}</td><td>${money(d.default_deposit)}</td><td><span class="pill ${esc(d.status)}">${esc(statusAr[d.status]||d.status)}</span></td>
      <td><div class="row-actions"><button class="btn light" onclick="editDress('${d.id}')">تعديل</button></div></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}
$('dressSearch').oninput=renderDresses;$('dressStatusFilter').onchange=renderDresses;

function resetDressForm(){
  $('dressForm').reset();$('dressId').value='';$('purchasePrice').value='0';$('rentalPrice').value='0';$('deposit').value='0';$('dressStatus').value='available';hideMsg($('dressFormMsg'));
}
$('addDressBtn').onclick=()=>{resetDressForm();$('dressModalTitle').textContent='إضافة فستان جديد';$('dressModal').classList.remove('hidden')};
$('closeDressModal').onclick=$('cancelDressBtn').onclick=()=>$('dressModal').classList.add('hidden');
window.editDress=id=>{
  const d=dresses.find(x=>x.id===id);if(!d)return;
  resetDressForm();$('dressModalTitle').textContent='تعديل الفستان';
  $('dressId').value=d.id;$('dressCode').value=d.dress_code||'';$('dressName').value=d.name||'';$('dressCategory').value=d.category_id||'';
  $('dressBranch').value=d.current_branch_id||'';$('dressSize').value=d.size||'';$('dressColor').value=d.color||'';
  $('purchasePrice').value=d.purchase_price??0;$('purchaseDate').value=d.purchase_date||'';$('supplier').value=d.supplier||'';
  $('rentalPrice').value=d.default_rental_price??0;$('deposit').value=d.default_deposit??0;$('salePrice').value=d.sale_price??'';
  $('dressStatus').value=d.status||'available';$('photoUrl').value=d.photo_url||'';$('dressNotes').value=d.notes||'';
  $('dressModal').classList.remove('hidden');
};
$('dressForm').onsubmit=async e=>{
  e.preventDefault();hideMsg($('dressFormMsg'));
  const payload={
    dress_code:$('dressCode').value.trim(),
    name:$('dressName').value.trim()||null,
    category_id:$('dressCategory').value?Number($('dressCategory').value):null,
    current_branch_id:Number($('dressBranch').value),
    size:$('dressSize').value.trim()||null,color:$('dressColor').value.trim()||null,
    purchase_price:Number($('purchasePrice').value||0),purchase_date:$('purchaseDate').value||null,supplier:$('supplier').value.trim()||null,
    default_rental_price:Number($('rentalPrice').value||0),default_deposit:Number($('deposit').value||0),
    sale_price:$('salePrice').value===''?null:Number($('salePrice').value),
    status:$('dressStatus').value,photo_url:$('photoUrl').value.trim()||null,notes:$('dressNotes').value.trim()||null,
    updated_at:new Date().toISOString()
  };
  if(!payload.dress_code||!payload.current_branch_id)return showMsg($('dressFormMsg'),'كود الفستان والفرع مطلوبان','error');
  const id=$('dressId').value;
  const res=id?await sb.from('dresses').update(payload).eq('id',id):await sb.from('dresses').insert(payload);
  if(res.error)return showMsg($('dressFormMsg'),'تعذر الحفظ: '+res.error.message,'error');
  showMsg($('dressFormMsg'),'تم الحفظ بنجاح','ok');
  await loadDresses();await loadDashboard();
  setTimeout(()=>$('dressModal').classList.add('hidden'),450);
};

boot();
</script>
</body>
</html>
