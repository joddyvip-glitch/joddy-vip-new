<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Joddy VIP Dresses</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f4f7;color:#231f26}.hidden{display:none!important}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#6f3a75;color:#fff;font-weight:700}.btn.alt{background:#736b75}.btn.light{background:#eee9ef;color:#332e35}.btn.danger{background:#b42318}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#2c2030,#6f3a75)}.loginbox{width:min(430px,100%);background:#fff;padding:26px;border-radius:20px}.logo{font-size:32px;font-weight:900;text-align:center}.sub{text-align:center;color:#756d77;margin:8px 0 20px}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#766d79}.field input,.field select,.field textarea{padding:10px;border:1px solid #d9d1dc;border-radius:9px;background:#fff}.field textarea{min-height:80px}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#2b202e;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:900;margin-bottom:8px}.user{font-size:12px;color:#ddd0df;margin-bottom:15px}.nav{display:grid;gap:7px}.nav button{border:0;background:#3d3041;color:#fff;padding:11px;border-radius:9px;text-align:right;cursor:pointer}.nav button.active{background:#fff;color:#2b202e}.logout{position:absolute;bottom:18px;right:18px;left:18px}
.main{padding:18px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.top h2{margin:0}.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid #ebe5ed;border-radius:15px;padding:15px;box-shadow:0 4px 20px #00000008}.stat small{color:#746d77}.stat strong{display:block;font-size:25px;margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.full{grid-column:1/-1}.wide{grid-column:span 2}
.tablewrap{overflow:auto;border:1px solid #ece7ee;border-radius:12px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:900px;background:white}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:13px;vertical-align:middle}th{background:#faf9fb}
.pill{padding:4px 8px;border-radius:999px;background:#eee9ef;font-size:12px;display:inline-block}.ok{background:#e9f7ef;color:#17663f}.warn{background:#fff2db;color:#8d5700}.bad{background:#fdeceb;color:#97211b}
.msg{padding:10px;border-radius:9px;background:#f2eef4;margin:8px 0}.msg.err{background:#fdeaea;color:#8f1c17}.rowactions{display:flex;gap:5px;flex-wrap:wrap}
.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:99}.modal{width:min(980px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee9ef;border-radius:9px;width:36px;height:36px;font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:0;border-radius:9px;padding:8px 10px;cursor:pointer}.tabactive{background:#6f3a75;color:#fff}.tabpane{display:none}.tabpane.active{display:block}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:sticky;z-index:20;display:block}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{position:static;margin-top:10px;width:100%}.grid{grid-template-columns:repeat(2,1fr)}.forms{grid-template-columns:1fr 1fr}.main{padding:12px}}
@media(max-width:620px){.forms{grid-template-columns:1fr}.wide,.full{grid-column:auto}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loginView" class="login">
 <div class="loginbox">
  <div class="logo">JODDY</div><div class="sub">نظام إدارة الفساتين والإيجارات والفروع والمالية</div>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password"></div>
  <button id="loginBtn" class="btn" style="width:100%;margin-top:10px">دخول</button>
  <div id="loginMsg"></div>
 </div>
</div>

<div id="appView" class="app hidden">
 <aside class="side">
  <div class="brand">JODDY</div><div id="userBox" class="user"></div>
  <div id="nav" class="nav"></div>
  <button id="logoutBtn" class="btn danger logout">تسجيل الخروج</button>
 </aside>
 <main class="main">
  <div class="top"><h2 id="pageTitle">لوحة التحكم</h2><button id="refreshBtn" class="btn light">تحديث</button></div>

  <section id="dashboard" class="section active">
   <div id="stats" class="grid"></div>
   <div class="card" style="margin-top:12px"><h3>تشغيل اليوم</h3><div id="todaySummary"></div></div>
  </section>

  <section id="dresses" class="section">
   <div class="toolbar"><button id="newDressBtn" class="btn">+ إضافة فستان</button><input id="dressSearch" placeholder="بحث بالكود/الاسم/اللون"><select id="dressFilter"><option value="">كل الحالات</option><option value="available">متاح</option><option value="booked">محجوز</option><option value="rented">مؤجر</option><option value="preparation">تجهيز</option><option value="maintenance">صيانة</option><option value="sold">مباع</option><option value="inactive">غير نشط</option></select></div>
   <div class="card"><div id="dressesTable"></div></div>
  </section>

  <section id="customers" class="section">
   <div class="toolbar"><button id="newCustomerBtn" class="btn">+ إضافة عميل</button></div>
   <div class="card"><div id="customersTable"></div></div>
  </section>

  <section id="bookings" class="section">
   <div class="toolbar"><button id="newBookingBtn" class="btn">+ حجز جديد</button></div>
   <div class="card"><div id="bookingsTable"></div></div>
  </section>

  <section id="preparation" class="section">
   <div class="card">
    <h3>التنظيف والتجهيز</h3>
    <div id="prepNav" class="tabs"></div>
    <div id="prepTable"></div>
   </div>
  </section>

  <section id="deposits" class="section">
   <div class="card"><h3>التأمينات المستحقة للعملاء</h3><div id="depositSummary" class="msg"></div><div id="depositsTable"></div></div>
  </section>

  <section id="branches" class="section">
   <div class="toolbar"><button id="newBranchBtn" class="btn">+ إضافة فرع</button></div>
   <div class="card"><div id="branchesTable"></div></div>
  </section>

  <section id="finance" class="section">
   <div id="financeStats" class="grid"></div>
   <div class="tabs" style="margin-top:12px">
    <button data-tab="payments" class="tabactive">التحصيلات</button><button data-tab="expenses">المصروفات</button><button data-tab="dexp">مصروفات الفساتين</button><button data-tab="sales">المبيعات</button>
   </div>
   <div id="payments" class="tabpane active card"><div class="msg">التحصيلات تظهر تلقائيًا من الحجوزات والإيجارات، ولا يتم إدخالها مرة ثانية من هنا.</div><div id="paymentsTable"></div></div>
   <div id="expenses" class="tabpane card"><div class="toolbar"><button id="newExpenseBtn" class="btn">+ مصروف عام</button></div><div id="expensesTable"></div></div>
   <div id="dexp" class="tabpane card"><div class="toolbar"><button id="newDressExpenseBtn" class="btn">+ مصروف فستان</button></div><div id="dressExpensesTable"></div></div>
   <div id="sales" class="tabpane card"><div class="toolbar"><button id="newSaleBtn" class="btn">+ بيع فستان</button></div><div id="salesTable"></div></div>
  </section>
 </main>
</div>

<div id="modalHost"></div>

<script>
const SUPABASE_URL='https://qzgtjuxiqmixjriiczxm.supabase.co';
const SUPABASE_KEY='sb_publishable_Q_HEnAkqk9jrMOjcF2krtA_KhTEZJaA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:2}).format(Number(v||0))+' ج.م';
function formatDMY(v){
 if(!v)return '—';
 const s=String(v).slice(0,10),m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(m)return `${m[3]}/${m[2]}/${m[1]}`;
 const d=new Date(v);if(isNaN(d))return esc(v);
 return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function parseDMY(v){
 const m=String(v||'').trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
 if(!m)return null;
 const dd=+m[1],mm=+m[2],yy=+m[3],d=new Date(yy,mm-1,dd);
 if(d.getFullYear()!==yy||d.getMonth()!==mm-1||d.getDate()!==dd)return null;
 return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}
function dateOnlyIso(ymd){return ymd?new Date(ymd+'T12:00:00').toISOString():null}
function addDaysYMD(ymd,days){const d=new Date(ymd+'T12:00:00');d.setDate(d.getDate()+Number(days||0));return d.toISOString().slice(0,10)}

const labels={dashboard:'لوحة التحكم',dresses:'الفساتين',bookings:'الحجوزات والإيجارات',customers:'العملاء',preparation:'التنظيف والتجهيز',deposits:'التأمينات المستحقة',branches:'الفروع',finance:'المالية'};
const statusAr={available:'متاح',booked:'محجوز',rented:'مؤجر',preparation:'تجهيز',maintenance:'صيانة',sold:'مباع',inactive:'غير نشط',reserved:'محجوز',confirmed:'مؤكد',picked_up:'تم الاستلام',returned:'تم الإرجاع',cancelled:'ملغي',completed:'مكتمل',pending:'معلق',in_progress:'جاري',done:'تم',skipped:'متخطى'};
let S={profile:null,branches:[],categories:[],dresses:[],customers:[],bookings:[],bookingDresses:[],prep:[],payments:[],expenses:[],dressExpenses:[],sales:[],transfers:[]};

function msg(el,t,e=false){el.innerHTML='<div class="msg '+(e?'err':'')+'">'+esc(t)+'</div>'}
async function audit(action,table,id,details={}){try{await sb.from('audit_log').insert({action,table_name:table,record_id:String(id||''),details})}catch{}}
function roleCanManage(){return S.profile&&S.profile.role!=='employee'}
function branchName(id){return S.branches.find(x=>String(x.id)===String(id))?.name||'—'}
function customerName(id){return S.customers.find(x=>x.id===id)?.full_name||'—'}
function dressName(id){const d=S.dresses.find(x=>x.id===id);return d?d.dress_code+' '+(d.name||''):'—'}
function openModal(title,body){$('modalHost').innerHTML=`<div class="modalbg"><div class="modal"><div class="modalhead"><h3>${esc(title)}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
window.closeModal=()=>{$('modalHost').innerHTML=''}

function navInit(){const n=$('nav');n.innerHTML='';Object.entries(labels).forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.id=id;if(id==='dashboard')b.classList.add('active');b.onclick=()=>showSection(id);n.appendChild(b)})}
function showSection(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('pageTitle').textContent=labels[id]}
async function login(){msg($('loginMsg'),'جاري الدخول...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg($('loginMsg'),'تعذر الدخول: '+error.message,true);await start()}
async function start(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:p,error}=await sb.from('user_profiles').select('*').eq('user_id',user.id).single();if(error||!p||!p.active){await sb.auth.signOut();return msg($('loginMsg'),'الحساب غير فعال أو غير مصرح',true)}S.profile=p;$('userBox').textContent=(p.full_name||user.email)+' — '+p.role;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');navInit();await refreshAll()}
async function refreshAll(){
 const qs=[
  sb.from('branches').select('*').order('name'),
  sb.from('categories').select('*').order('sort_order'),
  sb.from('dresses').select('*').order('created_at',{ascending:false}),
  sb.from('customers').select('*').order('created_at',{ascending:false}),
  sb.from('bookings').select('*').order('created_at',{ascending:false}),
  sb.from('booking_dresses').select('*'),
  sb.from('preparation_tasks').select('*'),
  sb.from('payments').select('*').order('paid_at',{ascending:false}),
  sb.from('expenses').select('*').order('expense_date',{ascending:false}),
  sb.from('dress_expenses').select('*').order('expense_date',{ascending:false}),
  sb.from('sales').select('*').order('sold_at',{ascending:false}),
  sb.from('dress_transfers').select('*').order('transferred_at',{ascending:false})
 ];
 const r=await Promise.all(qs);['branches','categories','dresses','customers','bookings','bookingDresses','prep','payments','expenses','dressExpenses','sales','transfers'].forEach((k,i)=>S[k]=r[i].data||[]);
 renderAll();
}
function renderAll(){renderDashboard();renderDresses();renderCustomers();renderBookings();renderPrep();renderDeposits();renderBranches();renderFinance()}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}">لا توجد بيانات</td></tr>`}</tbody></table></div>`}

function renderDashboard(){
 const dateYMD=(offset=0)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10)};
 const today=dateYMD(0),tomorrow=dateYMD(1),after=dateYMD(2);
 const available=S.dresses.filter(x=>x.status==='available').length,pending=S.prep.filter(x=>!['done','skipped'].includes(x.status)).length;
 const inPay=S.payments.filter(x=>x.payment_type!=='deposit_refund').reduce((a,x)=>a+Number(x.amount||0),0);
 const out=S.expenses.reduce((a,x)=>a+Number(x.amount||0),0)+S.dressExpenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const depositDue=S.bookings.filter(b=>b.status!=='cancelled').reduce((a,b)=>a+Math.max(0,Number(b.deposit_total||0)-Number(b.deposit_damage_deduction||0)-Number(b.deposit_refunded||0)),0);
 const stats=[['إجمالي الفساتين',S.dresses.length],['متاح',available],['الحجوزات',S.bookings.length],['العملاء',S.customers.length],['مهام تجهيز',pending],['التحصيلات',money(inPay)],['المصروفات',money(out)],['تأمينات علينا للعملاء',money(depositDue)]];
 $('stats').innerHTML=stats.map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');
 function dayBlock(label,ymd){
   const rows=[];
   S.bookings.filter(b=>b.status!=='cancelled').forEach(b=>{
     const c=customerName(b.customer_id);
     if(String(b.event_date||'').slice(0,10)===ymd)rows.push(`مناسبة: ${c} — حجز ${b.receipt_no}`);
     if(String(b.fitting_at||'').slice(0,10)===ymd)rows.push(`بروفة: ${c} — حجز ${b.receipt_no}`);
     if(String(b.pickup_at||'').slice(0,10)===ymd)rows.push(`استلام: ${c} — حجز ${b.receipt_no}`);
     if(String(b.expected_return_at||'').slice(0,10)===ymd)rows.push(`إرجاع: ${c} — حجز ${b.receipt_no}`);
   });
   return `<div class="card"><h4>${label} — ${formatDMY(ymd)}</h4>${rows.length?`<ul>${rows.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="muted">لا توجد أعمال مسجلة</div>'}</div>`;
 }
 $('todaySummary').innerHTML=`<div class="forms">${dayBlock('اليوم',today)}${dayBlock('غدًا',tomorrow)}${dayBlock('بعد غد',after)}</div>`;
}

function renderDresses(){
 const q=($('dressSearch')?.value||'').toLowerCase(),f=$('dressFilter')?.value||'';
 const arr=S.dresses.filter(d=>(!f||d.status===f)&&(!q||[d.dress_code,d.name,d.color,d.size].join(' ').toLowerCase().includes(q)));
 $('dressesTable').innerHTML=table(['الكود','الوصف','الفرع','المقاس','اللون','الإيجار','التأمين','الحالة','إجراء'],arr.map(d=>`<tr><td><b>${esc(d.dress_code)}</b></td><td>${esc(d.name||'')}</td><td>${esc(branchName(d.current_branch_id))}</td><td>${esc(d.size||'')}</td><td>${esc(d.color||'')}</td><td>${money(d.default_rental_price)}</td><td>${money(d.default_deposit)}</td><td><span class="pill">${esc(statusAr[d.status]||d.status)}</span></td><td><div class="rowactions"><button class="btn light" onclick="dressForm('${d.id}')">تعديل</button><button class="btn light" onclick="transferDress('${d.id}')">نقل</button></div></td></tr>`).join(''));
}
function dressForm(id=''){
 const d=S.dresses.find(x=>x.id===id)||{};
 const roots=S.categories.filter(x=>x.active&&!x.parent_id);
 const selectedCat=S.categories.find(x=>String(x.id)===String(d.category_id));
 const selectedRoot=selectedCat?.parent_id?S.categories.find(x=>x.id===selectedCat.parent_id):selectedCat;
 const bo=S.branches.filter(x=>x.active).map(x=>`<option value="${x.id}" ${String(x.id)===String(d.current_branch_id)?'selected':''}>${esc(x.name)}</option>`).join('');
 openModal(id?'تعديل فستان':'إضافة فستان',`<form id="dressForm" class="forms">
 <div class="field"><label>الكود *</label><input id="dfCode" value="${esc(d.dress_code||'')}" required></div>
 <div class="field"><label>الوصف</label><input id="dfName" value="${esc(d.name||'')}"></div>
 <div class="field"><label>التصنيف الرئيسي *</label><select id="dfRoot" required><option value="">اختر</option>${roots.map(x=>`<option value="${x.id}" ${selectedRoot?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>النوع الفرعي *</label><select id="dfCat" required></select></div>
 <div class="field"><label>الفرع *</label><select id="dfBranch">${bo}</select></div>
 <div class="field"><label>المقاس</label><input id="dfSize" value="${esc(d.size||'')}"></div>
 <div class="field"><label>اللون</label><input id="dfColor" value="${esc(d.color||'')}"></div>
 <div class="field"><label>سعر الشراء</label><input id="dfBuy" type="number" min="0" value="${d.purchase_price||0}"></div>
 <div class="field"><label>تاريخ الشراء</label><input id="dfBuyDate" type="date" value="${d.purchase_date||''}"></div>
 <div class="field"><label>المورد</label><input id="dfSupplier" value="${esc(d.supplier||'')}"></div>
 <div class="field"><label>سعر الإيجار *</label><input id="dfRent" type="number" min="1" value="${d.default_rental_price||''}" required></div>
 <div class="field"><label>التأمين *</label><input id="dfDep" type="number" min="0" value="${d.default_deposit??''}" required></div>
 <div class="field"><label>سعر البيع</label><input id="dfSale" type="number" min="0" value="${d.sale_price??''}"></div>
 <div class="field"><label>الحالة</label><select id="dfStatus">${Object.entries(statusAr).slice(0,7).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="field wide"><label>رابط الصورة</label><input id="dfPhoto" value="${esc(d.photo_url||'')}"></div>
 <div class="field full"><label>ملاحظات</label><textarea id="dfNotes">${esc(d.notes||'')}</textarea></div>
 <div class="full"><button class="btn">حفظ</button></div></form>`);
 function fillSubs(){
   const root=+$('dfRoot').value;
   const subs=S.categories.filter(x=>x.active&&x.parent_id===root);
   $('dfCat').innerHTML='<option value="">اختر النوع</option>'+subs.map(x=>`<option value="${x.id}" ${selectedCat?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
 }
 $('dfRoot').onchange=fillSubs;fillSubs();
 $('dressForm').onsubmit=async e=>{
   e.preventDefault();
   const rent=+$('dfRent').value,dep=+$('dfDep').value;
   if(!(rent>0))return alert('سعر الإيجار إجباري ويجب أن يكون أكبر من صفر');
   if(dep<0)return alert('قيمة التأمين غير صحيحة');
   const p={dress_code:$('dfCode').value.trim(),name:$('dfName').value.trim()||null,category_id:+$('dfCat').value,current_branch_id:+$('dfBranch').value,size:$('dfSize').value.trim()||null,color:$('dfColor').value.trim()||null,purchase_price:+$('dfBuy').value||0,purchase_date:$('dfBuyDate').value||null,supplier:$('dfSupplier').value.trim()||null,default_rental_price:rent,default_deposit:dep,sale_price:$('dfSale').value===''?null:+$('dfSale').value,status:$('dfStatus').value,photo_url:$('dfPhoto').value.trim()||null,notes:$('dfNotes').value.trim()||null,updated_at:new Date().toISOString()};
   const r=id?await sb.from('dresses').update(p).eq('id',id).select().single():await sb.from('dresses').insert(p).select().single();
   if(r.error)return alert(r.error.message);await audit(id?'update':'insert','dresses',r.data.id,{dress_code:r.data.dress_code});closeModal();await refreshAll()
 }
}

 function dressAvailableFor(dressId,pick,ret){
   if(!pick||!ret)return false;
   if(['sold','inactive','maintenance'].includes(S.dresses.find(x=>x.id===dressId)?.status))return false;
   const linked=S.bookingDresses.filter(x=>x.dress_id===dressId);
   for(const bd of linked){

     const blockedUntil=addDaysYMD(oldReturn,bd.prep_buffer_days||3);

   }

async function createPrepWorkflow(bookingId,mode){
 const items=S.bookingDresses.filter(x=>x.booking_id===bookingId);
 const isFit=mode==='fitting';
 const prefix=isFit?'بروفة:':'رجوع:';
 const stages=isFit
   ?['تسجيل المقاسات','تحديد التعديلات المطلوبة','تنفيذ التعديلات والخياطة','بروفة مراجعة','كي وتجهيز','فحص نهائي قبل التسليم','جاهز للاستلام']
   :['استلام وفحص بعد الإيجار','تسجيل التلفيات والملاحظات','تنظيف','تعقيم وإزالة الروائح','كي وتجهيز','إصلاح أو صيانة إن لزم','فحص نهائي وجاهز للإتاحة'];
 for(const it of items){
   const exists=S.prep.some(x=>x.booking_dress_id===it.id&&String(x.stage_name||'').startsWith(prefix));
   if(exists)continue;
   await sb.from('dresses').update({status:'preparation',...(isFit?{}:{current_branch_id:it.return_branch_id})}).eq('id',it.dress_id);
   const rows=stages.map((s,i)=>({booking_dress_id:it.id,stage_no:i+1,stage_name:prefix+' '+s,status:'pending'}));
   const pr=await sb.from('preparation_tasks').insert(rows);
   if(pr.error)return alert(pr.error.message);
 }
 await audit(isFit?'fitting_prep':'return_prep','bookings',bookingId);
 await refreshAll();
}

   <div class="card stat"><small>قيمة التأمين بالحجز</small><strong>${money(b.deposit_total)}</strong></div>
   <div class="card stat"><small>خصم سابق</small><strong>${money(existingDed)}</strong></div>
   <div class="card stat"><small>تم رده سابقاً</small><strong>${money(existingRefund)}</strong></div>
   <div class="card stat"><small>المتاح حالياً للرد</small><strong id="returnableView">${money(maxRefund)}</strong></div>
  </div>
  <div class="forms" style="margin-top:12px">
   <div class="field"><label>خصم من التأمين بسبب تلف / تنظيف / إصلاح</label><input id="damageDed" type="number" min="0" value="${existingDed}"></div>
   <div class="field wide"><label>سبب الخصم</label><input id="damageReason" value="${esc(b.deposit_damage_reason||'')}" placeholder="مثال: تلف سوستة / بقعة تحتاج تنظيف خاص"></div>
   <div class="field"><label>المبلغ المسترد للعميل الآن</label><input id="refundNow" type="number" min="0" value="${maxRefund}"></div>
   <div class="field"><label>هل تم رد التأمين الآن؟</label><select id="refundDone"><option value="yes">نعم - خرج من الخزينة</option><option value="no">لا - لم يستلمه بعد</option></select></div>
  </div>
  <div id="returnCalc" class="msg"></div>
  <button class="btn">تأكيد رجوع الفستان</button>
 </form>`);
 function calcReturn(){
   const ded=Math.max(0,+$('damageDed').value||0);
   const refundable=Math.max(0,Number(b.deposit_total||0)-ded-existingRefund);
   if(+$('refundNow').value>refundable)$('refundNow').value=refundable.toFixed(2);
   $('returnableView').textContent=money(refundable);
   $('returnCalc').innerHTML=`التأمين: <b>${money(b.deposit_total)}</b> — الخصم: <b>${money(ded)}</b> — الباقي المستحق للعميل: <b>${money(refundable)}</b>`;
 }
 $('damageDed').oninput=calcReturn;calcReturn();
 $('returnForm').onsubmit=async e=>{
   e.preventDefault();
   const ded=Math.max(0,+$('damageDed').value||0),reason=$('damageReason').value.trim()||null,done=$('refundDone').value==='yes';
   const refundable=Math.max(0,Number(b.deposit_total||0)-ded-existingRefund);
   let refundNow=Math.max(0,+$('refundNow').value||0);
   if(refundNow>refundable)return alert('المبلغ المسترد أكبر من التأمين المستحق');
   if(!done)refundNow=0;
   if(ded>Number(b.deposit_total||0))return alert('خصم التأمين لا يمكن أن يتجاوز قيمة التأمين');
   if(ded>0&&!reason)return alert('اكتب سبب خصم التأمين');

   const up={status:'returned',actual_return_at:new Date().toISOString(),deposit_damage_deduction:ded,deposit_damage_reason:reason,deposit_refunded:existingRefund+refundNow};
   const r=await sb.from('bookings').update(up).eq('id',id);if(r.error)return alert(r.error.message);

   if(refundNow>0){
     const pr=await sb.from('payments').insert({
       booking_id:id,branch_id:b.booking_branch_id,amount:refundNow,payment_type:'deposit_refund',
       payment_method:'رد تأمين',notes:reason?`رد تأمين بعد خصم: ${reason}`:'رد تأمين للعميل'
     });
     if(pr.error)return alert('تم رجوع الفستان لكن تعذر تسجيل خروج التأمين من المالية: '+pr.error.message);
   }
   if(ded>0){
     await sb.from('payments').insert({
       booking_id:id,branch_id:b.booking_branch_id,amount:ded,payment_type:'damage_deduction',
       payment_method:'خصم من التأمين',notes:reason
     });
   }
   await createPrepWorkflow(id,'return');
   await audit('return','bookings',id,{deposit: b.deposit_total,deduction:ded,reason,refund_now:refundNow});
   closeModal();await refreshAll();
 }
}
window.returnBooking=returnBooking;

function renderPrep(){
 const fitStages=['تسجيل المقاسات','تحديد التعديلات المطلوبة','تنفيذ التعديلات والخياطة','بروفة مراجعة','كي وتجهيز','فحص نهائي قبل التسليم','جاهز للاستلام'];
 const retStages=['استلام وفحص بعد الإيجار','تسجيل التلفيات والملاحظات','تنظيف','تعقيم وإزالة الروائح','كي وتجهيز','إصلاح أو صيانة إن لزم','فحص نهائي وجاهز للإتاحة'];
 const tabs=[...fitStages.map(x=>({key:'بروفة: '+x,label:'بروفة - '+x})),...retStages.map(x=>({key:'رجوع: '+x,label:'رجوع - '+x}))];
 let current=$('prepNav')?.dataset.current||tabs[0].key;
 $('prepNav').innerHTML=tabs.map(t=>`<button data-prep="${esc(t.key)}" class="${t.key===current?'tabactive':''}">${esc(t.label)}</button>`).join('');
 $('prepNav').dataset.current=current;
 function draw(){
   const rows=S.prep.filter(p=>String(p.stage_name||'')===current);
   $('prepTable').innerHTML=table(['الفستان','الحجز','الحالة','المسؤول','بدأ','اكتمل','ملاحظات','إجراء'],rows.map(p=>{
     const bd=S.bookingDresses.find(x=>x.id===p.booking_dress_id),b=S.bookings.find(x=>x.id===bd?.booking_id);
     return `<tr><td>${esc(dressName(bd?.dress_id))}</td><td>${esc(b?.receipt_no||'')}</td><td>${esc(statusAr[p.status]||p.status)}</td><td>${esc(p.responsible_name||'')}</td><td>${p.started_at?formatDMY(p.started_at):'—'}</td><td>${p.completed_at?formatDMY(p.completed_at):'—'}</td><td>${esc(p.notes||'')}</td><td><button class="btn light" onclick="prepAction('${p.id}')">تحديث</button></td></tr>`).join(''));
 }
 document.querySelectorAll('#prepNav button').forEach(b=>b.onclick=()=>{current=b.dataset.prep;$('prepNav').dataset.current=current;document.querySelectorAll('#prepNav button').forEach(x=>x.classList.toggle('tabactive',x===b));draw()});
 draw();
}

function prepAction(id){
 const p=S.prep.find(x=>x.id===id);
 openModal('تحديث مرحلة تجهيز',`<form id="pf" class="forms">
 <div class="field"><label>الحالة</label><select id="pfStatus">${['pending','in_progress','done','skipped'].map(x=>`<option value="${x}" ${p.status===x?'selected':''}>${statusAr[x]}</option>`).join('')}</select></div>
 <div class="field"><label>المسؤول</label><input id="pfResp" value="${esc(p.responsible_name||'')}"></div>
 <div class="field wide"><label>ملاحظات</label><input id="pfNotes" value="${esc(p.notes||'')}"></div>
 <div class="full"><button class="btn">حفظ</button></div></form>`);
 $('pf').onsubmit=async e=>{
   e.preventDefault();const s=$('pfStatus').value,u={status:s,responsible_name:$('pfResp').value.trim()||null,notes:$('pfNotes').value.trim()||null};
   if(s==='in_progress'&&!p.started_at)u.started_at=new Date().toISOString();
   if(s==='done')u.completed_at=new Date().toISOString();
   const r=await sb.from('preparation_tasks').update(u).eq('id',id);if(r.error)return alert(r.error.message);
   const bd=S.bookingDresses.find(x=>x.id===p.booking_dress_id);
   const prefix=String(p.stage_name||'').startsWith('بروفة:')?'بروفة:':String(p.stage_name||'').startsWith('رجوع:')?'رجوع:':'';
   const related=S.prep.filter(x=>x.booking_dress_id===p.booking_dress_id&&(!prefix||String(x.stage_name||'').startsWith(prefix)));
   const allDone=related.every(x=>x.id===id?['done','skipped'].includes(s):['done','skipped'].includes(x.status));
   if(allDone&&bd)await sb.from('dresses').update({status:prefix==='بروفة:'?'booked':'available'}).eq('id',bd.dress_id);
   closeModal();await refreshAll();
 }
}
window.prepAction=prepAction;

function renderDeposits(){
 const rows=[];
 S.bookings.filter(b=>b.status!=='cancelled').forEach(b=>{
   const due=Math.max(0,Number(b.deposit_total||0)-Number(b.deposit_damage_deduction||0)-Number(b.deposit_refunded||0));
   if(due<=0)return;
   const items=S.bookingDresses.filter(x=>x.booking_id===b.id);
   rows.push({b,due,items});
 });
 const total=rows.reduce((a,x)=>a+x.due,0);
 $('depositSummary').innerHTML=`إجمالي التأمينات التي ما زالت على المحل للعملاء: <b>${money(total)}</b> — عدد الحجوزات: <b>${rows.length}</b>`;
 $('depositsTable').innerHTML=table(['العميل','رقم الحجز','الفستان/الفساتين','التأمين الأصلي','الخصم','سبب الخصم','تم رده','المتبقي للعميل','موعد الاستحقاق','حالة الحجز'],
 rows.map(x=>`<tr>
  <td>${esc(customerName(x.b.customer_id))}</td><td>${x.b.receipt_no}</td>
  <td>${esc(x.items.map(i=>dressName(i.dress_id)).join(' / '))}</td>
  <td>${money(x.b.deposit_total)}</td><td>${money(x.b.deposit_damage_deduction)}</td><td>${esc(x.b.deposit_damage_reason||'—')}</td>
  <td>${money(x.b.deposit_refunded)}</td><td><b>${money(x.due)}</b></td>
  <td>${formatDMY(x.b.actual_return_at||x.b.expected_return_at)}</td><td>${esc(statusAr[x.b.status]||x.b.status)}</td>
 </tr>`).join(''));
}

function renderBranches(){$('branchesTable').innerHTML=table(['الفرع','الحالة','إجراء'],S.branches.map(b=>`<tr><td>${esc(b.name)}</td><td>${b.active?'نشط':'موقوف'}</td><td>${roleCanManage()?`<button class="btn light" onclick="toggleBranch(${b.id},${!b.active})">${b.active?'إيقاف':'تفعيل'}</button>`:''}</td></tr>`).join(''))}
function newBranch(){openModal('إضافة فرع',`<form id="brf" class="forms"><div class="field wide"><label>اسم الفرع</label><input id="brName"></div><div><button class="btn">حفظ</button></div></form>`);$('brf').onsubmit=async e=>{e.preventDefault();const r=await sb.from('branches').insert({name:$('brName').value.trim()}).select().single();if(r.error)return alert(r.error.message);closeModal();await refreshAll()}}
window.newBranch=newBranch;window.toggleBranch=async(id,v)=>{const r=await sb.from('branches').update({active:v}).eq('id',id);if(r.error)return alert(r.error.message);await refreshAll()}

function renderFinance(){
 const income=S.payments.filter(x=>x.payment_type!=='deposit_refund').reduce((a,x)=>a+Number(x.amount||0),0),refund=S.payments.filter(x=>x.payment_type==='deposit_refund').reduce((a,x)=>a+Number(x.amount||0),0),exp=S.expenses.reduce((a,x)=>a+Number(x.amount||0),0),dexp=S.dressExpenses.reduce((a,x)=>a+Number(x.amount||0),0),sales=S.sales.reduce((a,x)=>a+Number(x.sale_amount||0),0);
 const netCash=income+sales-refund-exp-dexp;
 $('financeStats').innerHTML=[['التحصيلات',money(income)],['رد التأمينات',money(refund)],['مصروفات عامة',money(exp)],['مصروفات فساتين',money(dexp)],['المبيعات',money(sales)],['صافي الحركة المالية',money(netCash)]].map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');
 $('paymentsTable').innerHTML=table(['التاريخ','الفرع','النوع','القيمة','طريقة الدفع','الحجز'],S.payments.map(x=>`<tr><td>${new Date(x.paid_at).toLocaleString('ar-EG')}</td><td>${esc(branchName(x.branch_id))}</td><td>${esc({rental:'تحصيل إيجار/حجز',deposit:'تحصيل تأمين',deposit_refund:'رد تأمين للعميل',damage_deduction:'خصم من التأمين',sale:'بيع',other:'أخرى'}[x.payment_type]||x.payment_type)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'')}</td><td>${esc(S.bookings.find(b=>b.id===x.booking_id)?.receipt_no||'')}</td></tr>`).join(''));
 $('expensesTable').innerHTML=table(['التاريخ','الفرع','البند','القيمة','البيان'],S.expenses.map(x=>`<tr><td>${x.expense_date}</td><td>${esc(branchName(x.branch_id))}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.description||'')}</td></tr>`).join(''));
 $('dressExpensesTable').innerHTML=table(['التاريخ','الفستان','الفرع','النوع','القيمة','ملاحظات'],S.dressExpenses.map(x=>`<tr><td>${x.expense_date}</td><td>${esc(dressName(x.dress_id))}</td><td>${esc(branchName(x.branch_id))}</td><td>${esc(x.expense_type)}</td><td>${money(x.amount)}</td><td>${esc(x.notes||'')}</td></tr>`).join(''));
 $('salesTable').innerHTML=table(['التاريخ','الفستان','العميل','الفرع','قيمة البيع','المدفوع'],S.sales.map(x=>`<tr><td>${new Date(x.sold_at).toLocaleString('ar-EG')}</td><td>${esc(dressName(x.dress_id))}</td><td>${esc(customerName(x.customer_id))}</td><td>${esc(branchName(x.branch_id))}</td><td>${money(x.sale_amount)}</td><td>${money(x.paid_amount)}</td></tr>`).join(''));
}
function paymentForm(){openModal('تسجيل تحصيل',`<form id="payf" class="forms"><div class="field"><label>الحجز</label><select id="payBooking"><option value="">بدون</option>${S.bookings.map(b=>`<option value="${b.id}">${b.receipt_no} - ${esc(customerName(b.customer_id))}</option>`).join('')}</select></div><div class="field"><label>الفرع</label><select id="payBranch">${S.branches.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>النوع</label><select id="payType"><option value="rental">إيجار</option><option value="deposit">تأمين</option><option value="deposit_refund">رد تأمين</option><option value="damage_deduction">خصم تلف</option><option value="other">أخرى</option></select></div><div class="field"><label>القيمة</label><input id="payAmount" type="number"></div><div class="field"><label>طريقة الدفع</label><input id="payMethod"></div><div class="field"><label>ملاحظات</label><input id="payNotes"></div><div class="full"><button class="btn">حفظ</button></div></form>`);$('payf').onsubmit=async e=>{e.preventDefault();const booking_id=$('payBooking').value||null,p={booking_id,branch_id:+$('payBranch').value,amount:+$('payAmount').value,payment_type:$('payType').value,payment_method:$('payMethod').value.trim()||null,notes:$('payNotes').value.trim()||null};const r=await sb.from('payments').insert(p).select().single();if(r.error)return alert(r.error.message);if(booking_id){const b=S.bookings.find(x=>x.id===booking_id);let paid=Number(b.paid_amount||0),bal=Number(b.balance_amount||0);if(p.payment_type==='deposit_refund')paid-=p.amount;else{paid+=p.amount;bal=Math.max(0,bal-p.amount)}await sb.from('bookings').update({paid_amount:paid,balance_amount:bal}).eq('id',booking_id)}closeModal();await refreshAll()}}

sb.auth.getSession().then(({data})=>data.session?start():null);
